name: media_downloader
description: "A complete media downloader application for Android & iOS with one-click download, automatic gallery sorting, and Ubuntu backend integration."
publish_to: "none"

version: 1.0.4+5

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Networking & HTTP
  http: ^1.2.0
  dio: ^5.4.3+1

  # Gallery & Media Store Saving (Immediate Indexing)
  gal: ^2.3.1
  image_gallery_saver: ^2.0.3

  # Permissions Handling
  permission_handler: ^11.3.1

  # In-App WebView for Ads
  webview_flutter: ^4.7.0

  # Local Persistence (History)
  shared_preferences: ^2.2.3
  sqflite: ^2.3.2
  path: ^1.9.0

  # UI & Utilities
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  share_plus: ^9.0.0
  open_filex: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
